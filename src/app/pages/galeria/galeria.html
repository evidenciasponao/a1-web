<div class="container">

    <h1>Nuestra Colección</h1>

    <div class="cards">

        <article class="card" *ngFor="let manilla of manillas">

            <button type="button" class="imagen-button" (click)="abrirManilla(manilla)"
                [attr.aria-label]="'Ver detalles de ' + manilla.nombre">

                <img [src]="manilla.imagen" [alt]="manilla.nombre" loading="lazy">

            </button>

            <div class="card-info">

                <h2>
                    {{ manilla.nombre }}
                </h2>

                <p class="card-precio">
                    {{ manilla.precio }}
                </p>

                <a class="btn-whatsapp" target="_blank" rel="noopener noreferrer" [href]="'https://wa.me/573114147623?text=Hola,%20me%20interesa%20la%20manilla%20'
                        + manilla.nombre
                        + '%20que%20vi%20en%20su%20galería.'">

                    Comprar por WhatsApp

                </a>

            </div>

        </article>

    </div>

</div>


<!-- ==========================
     MODAL PRODUCTO
========================== -->

<div class="modal" *ngIf="manillaSeleccionada" (click)="cerrarManilla()" role="dialog" aria-modal="true">

    <article class="modal-content" (click)="$event.stopPropagation()">

        <button type="button" class="modal-close" (click)="cerrarManilla()" aria-label="Cerrar detalles del producto">

            ×

        </button>


        <!-- IMAGEN -->

        <div class="modal-image">

            <img [src]="manillaSeleccionada.imagen" [alt]="manillaSeleccionada.nombre">

        </div>


        <!-- INFORMACIÓN -->

        <div class="modal-info">

            <span class="modal-label">
                CREACIÓN APOLO
            </span>

            <h2>
                {{ manillaSeleccionada.nombre }}
            </h2>

            <p class="precio">
                {{ manillaSeleccionada.precio }}
            </p>

            <p class="descripcion">
                {{ manillaSeleccionada.descripcion }}
            </p>

            <a class="btn-whatsapp" target="_blank" rel="noopener noreferrer" [href]="'https://wa.me/573114147623?text=Hola,%20me%20interesa%20la%20'
                    + manillaSeleccionada.nombre
                    + '%20que%20vi%20en%20su%20galería.'">

                Comprar por WhatsApp

            </a>

        </div>

    </article>

</div>
